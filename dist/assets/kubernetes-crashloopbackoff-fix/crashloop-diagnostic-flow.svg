<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none" role="img" aria-label="CrashLoopBackOff diagnostic decision tree">
  <rect width="960" height="640" fill="#fafafa"/>
  <text x="480" y="36" text-anchor="middle" fill="#09090b" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700">CrashLoopBackOff diagnostic decision tree</text>
  <text x="480" y="58" text-anchor="middle" fill="#52525b" font-family="system-ui,-apple-system,sans-serif" font-size="13">describe pod, read Events, branch to the fix path</text>

  <rect x="380" y="80" width="200" height="44" rx="8" fill="#18181b"/>
  <text x="480" y="108" text-anchor="middle" fill="#fafafa" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Pod: CrashLoopBackOff</text>

  <line x1="480" y1="124" x2="480" y2="148" stroke="#a1a1aa" stroke-width="2"/>
  <rect x="330" y="148" width="300" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="176" text-anchor="middle" fill="#5b21b6" font-family="ui-monospace,monospace" font-size="12" font-weight="700">kubectl describe pod / Events</text>

  <line x1="480" y1="192" x2="480" y2="216" stroke="#a1a1aa" stroke-width="2"/>
  <line x1="120" y1="216" x2="840" y2="216" stroke="#a1a1aa" stroke-width="2"/>
  <line x1="120" y1="216" x2="120" y2="240" stroke="#a1a1aa" stroke-width="2"/>
  <line x1="320" y1="216" x2="320" y2="240" stroke="#a1a1aa" stroke-width="2"/>
  <line x1="520" y1="216" x2="520" y2="240" stroke="#a1a1aa" stroke-width="2"/>
  <line x1="720" y1="216" x2="720" y2="240" stroke="#a1a1aa" stroke-width="2"/>
  <line x1="840" y1="216" x2="840" y2="240" stroke="#a1a1aa" stroke-width="2"/>

  <rect x="40" y="240" width="160" height="72" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="120" y="268" text-anchor="middle" fill="#991b1b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">OOMKilled</text>
  <text x="120" y="286" text-anchor="middle" fill="#52525b" font-family="system-ui,sans-serif" font-size="10">Exit 137</text>
  <text x="120" y="302" text-anchor="middle" fill="#52525b" font-family="system-ui,sans-serif" font-size="10">Raise limits</text>

  <rect x="240" y="240" width="160" height="72" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="320" y="268" text-anchor="middle" fill="#9a3412" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Probe failed</text>
  <text x="320" y="286" text-anchor="middle" fill="#52525b" font-family="system-ui,sans-serif" font-size="10">Liveness / readiness</text>
  <text x="320" y="302" text-anchor="middle" fill="#52525b" font-family="system-ui,sans-serif" font-size="10">startupProbe</text>

  <rect x="440" y="240" width="160" height="72" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
  <text x="520" y="268" text-anchor="middle" fill="#854d0e" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Config error</text>
  <text x="520" y="286" text-anchor="middle" fill="#52525b" font-family="system-ui,sans-serif" font-size="10">Secret / env</text>
  <text x="520" y="302" text-anchor="middle" fill="#52525b" font-family="system-ui,sans-serif" font-size="10">Fix keys</text>

  <rect x="640" y="240" width="160" height="72" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="720" y="268" text-anchor="middle" fill="#166534" font-family="system-ui,sans-serif" font-size="11" font-weight="700">App exit</text>
  <text x="720" y="286" text-anchor="middle" fill="#52525b" font-family="system-ui,sans-serif" font-size="10">logs --previous</text>
  <text x="720" y="302" text-anchor="middle" fill="#52525b" font-family="system-ui,sans-serif" font-size="10">Stack trace</text>

  <rect x="760" y="240" width="160" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="840" y="268" text-anchor="middle" fill="#1e40af" font-family="system-ui,sans-serif" font-size="11" font-weight="700">After deploy</text>
  <text x="840" y="286" text-anchor="middle" fill="#52525b" font-family="system-ui,sans-serif" font-size="10">4 min post-rollout</text>
  <text x="840" y="302" text-anchor="middle" fill="#52525b" font-family="system-ui,sans-serif" font-size="10">rollout undo</text>

  <line x1="120" y1="312" x2="120" y2="360" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="320" y1="312" x2="320" y2="360" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="520" y1="312" x2="520" y2="360" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="720" y1="312" x2="720" y2="360" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="840" y1="312" x2="840" y2="360" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 4"/>

  <rect x="280" y="360" width="400" height="44" rx="8" fill="#18181b"/>
  <text x="480" y="388" text-anchor="middle" fill="#86efac" font-family="ui-monospace,monospace" font-size="12" font-weight="700">kubectl logs POD --previous</text>

  <line x1="480" y1="404" x2="480" y2="428" stroke="#a1a1aa" stroke-width="2"/>
  <rect x="330" y="428" width="300" height="44" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="480" y="456" text-anchor="middle" fill="#166534" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Verify: restart count stops climbing</text>

  <text x="480" y="520" text-anchor="middle" fill="#71717a" font-family="system-ui,sans-serif" font-size="11">Backoff timer: 10s, 20s, 40s, up to 5 min between restarts</text>
  <text x="480" y="540" text-anchor="middle" fill="#52525b" font-family="system-ui,sans-serif" font-size="11">CrashLoopBackOff is the timer, not the root cause</text>
</svg>
