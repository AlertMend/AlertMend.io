  <text x="120" y="480" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#09090b">Monitor URLs. Automate simple fixes.</text>
  <text x="120" y="515" font-family="system-ui,sans-serif" font-size="16" fill="#52525b">Detect 5xx errors and restart services before on-call wakes up.</text>
