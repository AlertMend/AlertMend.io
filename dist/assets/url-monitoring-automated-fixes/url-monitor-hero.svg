  <rect x="120" y="340" width="200" height="72" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="140" y="372" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#991b1b">503 detected</text>
  <text x="140" y="394" font-family="system-ui,sans-serif" font-size="12" fill="#7f1d1d">2 consecutive failures</text>
  <path d="M340 376 L460 376" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="480" y="340" width="200" height="72" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="500" y="372" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#5b21b6">Auto-fix</text>
