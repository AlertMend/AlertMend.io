<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" role="img" aria-label="503 flow: client to proxy to empty upstream pool">
  <rect width="960" height="200" fill="#fafafa" rx="8"/>
  <rect x="40" y="60" width="160" height="80" rx="8" fill="#fff" stroke="#e4e4e7" stroke-width="2"/>
  <text x="120" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#09090b">Client</text>
  <path d="M210 100 H280" stroke="#a1a1aa" stroke-width="2" marker-end="url(#arrow503)"/>
  <rect x="290" y="60" width="200" height="80" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="390" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#09090b">Ingress / Proxy</text>
  <text x="390" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#71717a">nginx, Envoy, Istio</text>
  <path d="M500 100 H570" stroke="#a1a1aa" stroke-width="2"/>
  <rect x="580" y="60" width="200" height="80" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="680" y="98" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#dc2626">No healthy upstream</text>
  <text x="680" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#71717a">0 ready endpoints</text>
  <path d="M390 150 v20 H120 v-20" stroke="#fca5a5" stroke-width="2" fill="none"/>
  <text x="255" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#dc2626">503 Service Unavailable</text>
  <defs>
    <marker id="arrow503" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a1a1aa"/>
    </marker>
  </defs>
</svg>
