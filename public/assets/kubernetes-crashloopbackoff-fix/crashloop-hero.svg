<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Kubernetes CrashLoopBackOff diagnose and fix runbook">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f4f4f5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg2)"/>
  <rect x="80" y="100" width="1040" height="430" rx="12" fill="#18181b"/>
  <text x="120" y="160" font-family="ui-monospace,monospace" font-size="20" fill="#86efac">$ kubectl get pods</text>
  <text x="120" y="200" font-family="ui-monospace,monospace" font-size="18" fill="#e4e4e7">NAME          READY   STATUS             RESTARTS</text>
  <text x="120" y="235" font-family="ui-monospace,monospace" font-size="18" fill="#fca5a5">api-7f9c2   0/1     CrashLoopBackOff   14</text>
  <text x="120" y="290" font-family="ui-monospace,monospace" font-size="20" fill="#86efac">$ kubectl logs api-7f9c2 --previous</text>
  <text x="120" y="330" font-family="ui-monospace,monospace" font-size="16" fill="#a1a1aa">Error: missing env DATABASE_URL</text>
  <text x="120" y="380" font-family="ui-monospace,monospace" font-size="20" fill="#86efac">$ kubectl describe pod api-7f9c2</text>
  <text x="120" y="420" font-family="ui-monospace,monospace" font-size="16" fill="#fde68a">Back-off restarting failed container</text>
  <rect x="720" y="280" width="360" height="200" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="2"/>
  <text x="750" y="330" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#09090b">AlertMend</text>
  <text x="750" y="370" font-family="system-ui,sans-serif" font-size="16" fill="#52525b">Correlate crash + deploy</text>
  <text x="750" y="400" font-family="system-ui,sans-serif" font-size="16" fill="#52525b">Rollback or restart runbook</text>
  <text x="750" y="430" font-family="system-ui,sans-serif" font-size="16" fill="#7c3aed">Verify before page</text>
  <text x="600" y="580" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#71717a">CrashLoopBackOff � diagnose � fix � prevent</text>
</svg>
