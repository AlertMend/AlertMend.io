<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" role="img" aria-labelledby="title desc">
  <title id="title">CrashLoopBackOff diagnostic flow</title>
  <desc id="desc">CrashLoopBackOff means the container started, exited, and kubelet is backing off. The fix path starts with previous logs, last terminated state, events, rollout history, and verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7ff"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4c1d95" flood-opacity="0.10"/>
    </filter>
    <style>
      .label { font: 700 13px system-ui, -apple-system, Segoe UI, sans-serif; letter-spacing: .13em; text-transform: uppercase; fill: #7c3aed; }
      .title { font: 800 30px system-ui, -apple-system, Segoe UI, sans-serif; fill: #111827; }
      .body { font: 500 17px system-ui, -apple-system, Segoe UI, sans-serif; fill: #4b5563; }
      .card-title { font: 800 17px system-ui, -apple-system, Segoe UI, sans-serif; fill: #111827; }
      .card-text { font: 500 14px system-ui, -apple-system, Segoe UI, sans-serif; fill: #4b5563; }
      .mono { font: 650 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #374151; }
      .pill { font: 700 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #4b5563; }
      .arrow { stroke: #7c3aed; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1040" height="460" rx="30" fill="url(#bg)"/>
  <rect x="24" y="24" width="992" height="412" rx="24" fill="#ffffff" fill-opacity="0.76" stroke="#ddd6fe"/>

  <text x="64" y="72" class="label">Read the evidence in this order</text>
  <text x="64" y="112" class="title">CrashLoopBackOff is a restart timer, not a root cause</text>
  <text x="64" y="146" class="body">The container already started. Now find why the last run exited.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="190" width="176" height="96" rx="18" fill="url(#dark)"/>
    <text x="92" y="226" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Started</text>
    <text x="92" y="256" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#d1d5db">image pulled</text>
  </g>

  <path class="arrow" d="M258 238H312"/>
  <path class="arrow" d="M301 226l14 12-14 12"/>

  <g filter="url(#shadow)">
    <rect x="336" y="190" width="176" height="96" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="364" y="226" class="card-title">Exited</text>
    <text x="364" y="256" class="card-text">app error, OOM, probe</text>
  </g>

  <path class="arrow" d="M530 238H584"/>
  <path class="arrow" d="M573 226l14 12-14 12"/>

  <g filter="url(#shadow)">
    <rect x="608" y="190" width="176" height="96" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="636" y="226" class="card-title">Kubelet restarts</text>
    <text x="636" y="256" class="card-text">waits longer each time</text>
  </g>

  <path class="arrow" d="M802 238H856"/>
  <path class="arrow" d="M845 226l14 12-14 12"/>

  <g filter="url(#shadow)">
    <rect x="880" y="190" width="96" height="96" rx="18" fill="#fef2f2" stroke="#fecaca"/>
    <text x="928" y="226" text-anchor="middle" class="card-title">BackOff</text>
    <text x="928" y="256" text-anchor="middle" class="card-text">status only</text>
  </g>

  <g>
    <rect x="64" y="326" width="190" height="54" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="88" y="348" class="mono">logs --previous</text>
    <text x="88" y="368" class="pill">last app message</text>

    <rect x="276" y="326" width="190" height="54" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="300" y="348" class="mono">lastState</text>
    <text x="300" y="368" class="pill">exit code and reason</text>

    <rect x="488" y="326" width="190" height="54" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="512" y="348" class="mono">describe pod</text>
    <text x="512" y="368" class="pill">probe and event clues</text>

    <rect x="700" y="326" width="132" height="54" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="724" y="348" class="mono">rollout</text>
    <text x="724" y="368" class="pill">what changed</text>

    <rect x="854" y="326" width="122" height="54" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="878" y="348" class="mono">verify</text>
    <text x="878" y="368" class="pill">restarts stop</text>
  </g>
</svg>
