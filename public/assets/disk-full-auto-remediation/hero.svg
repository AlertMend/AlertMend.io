<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Disk Full Auto-Remediation</title>
  <desc id="desc">AlertMend turns disk full alerts into safe cleanup, approval gates, verification, and audit-ready incident updates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.56" stop-color="#1f1237"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="38" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="72" y="72" width="1056" height="486" rx="30" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".16"/>
  </g>
  <text x="112" y="142" fill="#c4b5fd" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="700" letter-spacing="4">ALERTMEND USE CASE</text>
  <text x="112" y="226" fill="#fff" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="68" font-weight="800">Disk full alerts</text>
  <text x="112" y="300" fill="#fff" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="68" font-weight="800">that fix themselves safely</text>
  <text x="112" y="368" fill="#ddd6fe" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="500">Diagnose growth, clean safe paths, ask approval for risk, verify recovery.</text>
  <rect x="112" y="438" width="362" height="58" rx="29" fill="#fff"/>
  <text x="293" y="476" text-anchor="middle" fill="#09090b" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800">Book a remediation review</text>
  <rect x="762" y="130" width="254" height="314" rx="26" fill="#111827" fill-opacity=".72" stroke="#fff" stroke-opacity=".18"/>
  <text x="802" y="184" fill="#d1d5db" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700">/var</text>
  <text x="802" y="240" fill="#fff" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="54" font-weight="800">91%</text>
  <rect x="802" y="282" width="174" height="18" rx="9" fill="#312e81"/>
  <rect x="802" y="282" width="146" height="18" rx="9" fill="url(#bar)"/>
  <text x="802" y="350" fill="#c4b5fd" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700">safe cleanup ready</text>
  <text x="802" y="386" fill="#f5f3ff" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="500">logs: 18 GB</text>
  <text x="802" y="416" fill="#f5f3ff" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="500">images: 11 GB</text>
</svg>
