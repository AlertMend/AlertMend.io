<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0b0b"/><stop offset="1" stop-color="#3f0d0d"/></linearGradient></defs><rect width="1200" height="630" fill="url(#hg)"/><g transform="translate(80,80)"><circle cx="22" cy="22" r="22" fill="#dc2626"/><text x="22" y="30" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">A</text><text x="56" y="30" font-size="24" font-weight="700" fill="#fff">AlertMend</text><text x="228" y="30" font-size="18" fill="#f0a0a0">· troubleshooting</text></g><text x="80" y="250" font-size="66" font-weight="800" fill="#fff">SIGSEGV (signal 11)</text><text x="80" y="316" font-size="31" font-weight="700" fill="#f87171">Segmentation fault · exit code 139</text><g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19"><rect x="80" y="368" width="1040" height="150" rx="14" fill="#200f0f" stroke="#4a1d1d"/><text x="108" y="406" fill="#fca5a5">$ ./app</text><text x="108" y="442" fill="#fecaca">Segmentation fault (core dumped)</text><text x="108" y="478" fill="#fca5a5">$ echo $?</text><text x="320" y="478" fill="#fecaca">139</text></g><text x="80" y="566" font-size="19" fill="#f0a0a0">alertmend.io · core dump, gdb, AddressSanitizer, and the exit-139 fix</text></svg>
