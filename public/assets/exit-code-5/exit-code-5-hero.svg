<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b14"/><stop offset="1" stop-color="#241b4d"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#hg)"/>
  <g transform="translate(80,76)"><circle cx="25" cy="25" r="25" fill="#fff"/><image href="/logos/alertmend-logo.svg" x="8" y="6" width="34" height="38" preserveAspectRatio="xMidYMid meet"/><text x="64" y="33" font-size="24" font-weight="700" fill="#fff">AlertMend</text><text x="236" y="33" font-size="18" fill="#8b82b8">· Troubleshooting</text></g>
  <text x="80" y="212" font-size="66" font-weight="800" fill="#fff">Exit Code 5</text>
  <text x="80" y="272" font-size="30" fill="#c4b5fd">What it means, and how to fix it, by program</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
    <rect x="80" y="322" width="1040" height="184" rx="14" fill="#12111f" stroke="#312b57"/>
    <text x="108" y="362" fill="#a78bfa">pytest</text><text x="300" y="362" fill="#e9e3ff">no tests were collected</text>
    <text x="108" y="398" fill="#a78bfa">curl</text><text x="300" y="398" fill="#e9e3ff">could not resolve the proxy</text>
    <text x="108" y="434" fill="#a78bfa">windows</text><text x="300" y="434" fill="#e9e3ff">access is denied</text>
    <text x="108" y="470" fill="#a78bfa">systemd</text><text x="300" y="470" fill="#e9e3ff">the status your service returned</text>
  </g>
  <text x="80" y="560" font-size="20" fill="#8b82b8">alertmend.io · Diagnose it by the program that returned it, not the number</text>
</svg>
