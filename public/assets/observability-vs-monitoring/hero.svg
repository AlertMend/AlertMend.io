<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e0b1e"/><stop offset="1" stop-color="#2a1163"/></linearGradient></defs><rect width="1200" height="630" fill="url(#hg)"/><g transform="translate(80,80)"><circle cx="22" cy="22" r="22" fill="#7c3aed"/><text x="22" y="30" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">A</text><text x="56" y="30" font-size="24" font-weight="700" fill="#fff">AlertMend</text><text x="228" y="30" font-size="18" fill="#b9a7e6">· observability</text></g><text x="80" y="248" font-size="56" font-weight="800" fill="#fff">Observability vs Monitoring</text><text x="80" y="312" font-size="30" font-weight="700" fill="#a78bfa">Detection tells you what. Explanation tells you why.</text><g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19"><rect x="80" y="364" width="1040" height="152" rx="14" fill="#170f2e" stroke="#3b2a63"/><text x="106" y="402" fill="#c4b5fd">monitoring</text><text x="360" y="402" fill="#e7defb">known-unknowns, alerts, dashboards</text><text x="106" y="438" fill="#c4b5fd">observability</text><text x="360" y="438" fill="#e7defb">unknown-unknowns, open questions</text><text x="106" y="476" fill="#c4b5fd">both</text><text x="360" y="476" fill="#e7defb">detect first, then explain, then fix</text></g><text x="80" y="566" font-size="19" fill="#b9a7e6">alertmend.io · the real difference, and why you need both</text></svg>
