<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" fill="none" role="img" aria-label="ImagePullBackOff state flow">
  <rect width="960" height="200" fill="#fafafa"/>
  <text x="480" y="28" text-anchor="middle" fill="#09090b" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Pull lifecycle: where ImagePullBackOff fits</text>
  <rect x="40" y="60" width="150" height="44" rx="8" fill="#f4f4f5" stroke="#a1a1aa"/>
  <text x="115" y="88" text-anchor="middle" fill="#3f3f46" font-family="system-ui,sans-serif" font-size="11" font-weight="600">ContainerCreating</text>
  <text x="205" y="88" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="18">-&gt;</text>
  <rect x="230" y="60" width="120" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="290" y="88" text-anchor="middle" fill="#991b1b" font-family="system-ui,sans-serif" font-size="11" font-weight="600">ErrImagePull</text>
  <text x="365" y="88" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="18">-&gt;</text>
