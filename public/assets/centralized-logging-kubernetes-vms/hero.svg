<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Centralized Logging for Kubernetes and VMs</title>
  <desc id="desc">Centralized logs, instant search, your own bucket, no Elasticsearch cluster to manage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.58" stop-color="#1f0b45"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="44" fill="url(#bg)"/>
  <circle cx="1030" cy="110" r="190" fill="#7c3aed" opacity=".18"/>
  <circle cx="160" cy="560" r="220" fill="#2563eb" opacity=".14"/>
  <g transform="translate(82 68)">
    <image href="https://www.alertmend.io/logos/alertmend-logo.svg" x="0" y="0" width="54" height="54" preserveAspectRatio="xMidYMid meet"/>
    <text x="72" y="37" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="32" font-weight="800">AlertMend</text>
    <text x="288" y="37" fill="#c4b5fd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="700">logging tool</text>
  </g>
  <text x="82" y="210" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="72" font-weight="900" letter-spacing="-2.8">
    <tspan x="82" dy="0">Centralized logs.</tspan>
    <tspan x="82" dy="82">Instant search.</tspan>
  </text>
  <text x="82" y="405" fill="#ddd6fe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="600">
    <tspan x="82" dy="0">1-click agents for Kubernetes and VMs.</tspan>
    <tspan x="82" dy="44">Store logs in your own S3 or MinIO bucket.</tspan>
  </text>
  <g transform="translate(710 175)" filter="url(#softShadow)">
    <rect width="390" height="272" rx="28" fill="#fff" opacity=".96"/>
    <rect x="28" y="34" width="334" height="48" rx="14" fill="#f4f4f5"/>
    <text x="52" y="65" fill="#7c3aed" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">level:error namespace:payments</text>
    <rect x="28" y="112" width="76" height="26" rx="8" fill="#fee2e2"/>
    <text x="42" y="131" fill="#dc2626" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="800">ERROR</text>
    <text x="120" y="132" fill="#18181b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">payments-api</text>
    <text x="28" y="174" fill="#52525b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">OOMKilled: exceeded 512Mi</text>
    <text x="28" y="220" fill="#52525b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">connection reset by peer</text>
  </g>
  <g transform="translate(82 520)">
    <rect width="184" height="44" rx="22" fill="#fff" opacity=".14"/>
    <text x="24" y="29" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="800">No Elasticsearch</text>
    <rect x="206" width="156" height="44" rx="22" fill="#fff" opacity=".14"/>
    <text x="230" y="29" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="800">Own bucket</text>
    <rect x="384" width="158" height="44" rx="22" fill="#fff" opacity=".14"/>
    <text x="408" y="29" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="800">Self-hosted</text>
  </g>
</svg>
