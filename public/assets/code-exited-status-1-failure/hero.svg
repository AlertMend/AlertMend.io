<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#231a05"/></linearGradient></defs><rect width="1200" height="630" fill="url(#hg)"/><g transform="translate(80,80)"><circle cx="22" cy="22" r="22" fill="#f59e0b"/><text x="22" y="30" font-size="22" font-weight="800" fill="#111" text-anchor="middle">A</text><text x="56" y="30" font-size="24" font-weight="700" fill="#fff">AlertMend</text><text x="228" y="30" font-size="18" fill="#d6b877">· troubleshooting</text></g><text x="80" y="238" font-size="52" font-weight="800" fill="#fff">code=exited, status=1/failure</text><text x="80" y="300" font-size="30" font-weight="700" fill="#fbbf24">Fix a systemd service that will not start.</text><g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18"><rect x="80" y="352" width="1040" height="166" rx="14" fill="#161616" stroke="#3a3320"/><text x="106" y="388" fill="#fca5a5">Active: failed (result: exit-code)</text><text x="106" y="422" fill="#e6d6a8">Process: ExecStart=/usr/bin/dockerd (code=exited, status=1/FAILURE)</text><text x="106" y="462" fill="#7dd3fc">$ journalctl -xeu docker</text><text x="106" y="496" fill="#d1d5db">the real error is one line up, not in status=1</text></g><text x="80" y="566" font-size="19" fill="#d6b877">alertmend.io · read the journal, fix the real cause, automate the recovery</text></svg>
