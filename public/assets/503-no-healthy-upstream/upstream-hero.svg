<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="503 no healthy upstream: ingress cannot reach ready backends">
  <defs>
    <linearGradient id="bg503" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f4f4f5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg503)"/>
  <rect x="80" y="100" width="1040" height="430" rx="12" fill="#18181b"/>
  <text x="120" y="160" font-family="ui-monospace,monospace" font-size="20" fill="#86efac">$ curl -I https://api.example.com/health</text>
  <text x="120" y="210" font-family="ui-monospace,monospace" font-size="18" fill="#fca5a5">HTTP/1.1 503 Service Unavailable</text>
  <text x="120" y="250" font-family="ui-monospace,monospace" font-size="16" fill="#fde68a">no healthy upstream</text>
  <text x="120" y="310" font-family="ui-monospace,monospace" font-size="20" fill="#86efac">$ kubectl get endpoints api -n prod</text>
  <text x="120" y="350" font-family="ui-monospace,monospace" font-size="16" fill="#a1a1aa">NAME   ENDPOINTS   AGE</text>
  <text x="120" y="380" font-family="ui-monospace,monospace" font-size="16" fill="#fca5a5">api    &lt;none&gt;      47m</text>
  <text x="120" y="430" font-family="ui-monospace,monospace" font-size="18" fill="#86efac">$ kubectl get pods -l app=api</text>
  <text x="120" y="465" font-family="ui-monospace,monospace" font-size="16" fill="#fde68a">0/3 Ready  readiness probe failing</text>
  <rect x="720" y="280" width="360" height="200" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="2"/>
  <text x="750" y="330" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#09090b">AlertMend</text>
  <text x="750" y="370" font-family="system-ui,sans-serif" font-size="16" fill="#52525b">URL check on ingress</text>
  <text x="750" y="400" font-family="system-ui,sans-serif" font-size="16" fill="#52525b">Correlate endpoints drain</text>
  <text x="750" y="430" font-family="system-ui,sans-serif" font-size="16" fill="#7c3aed">Auto rollback or restart</text>
  <text x="600" y="580" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#71717a">Endpoints, probes, rollouts, mesh</text>
</svg>
