<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
  <title id="title">ImagePullBackOff diagnostic flow</title>
  <desc id="desc">A Kubernetes image pull failure starts with pod status, moves to pod events, then branches to image, secret, registry, network, TLS, or node disk fixes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7ff"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4c1d95" flood-opacity="0.10"/>
    </filter>
    <style>
      .label { font: 700 13px system-ui, -apple-system, Segoe UI, sans-serif; letter-spacing: .13em; text-transform: uppercase; fill: #7c3aed; }
      .title { font: 800 30px system-ui, -apple-system, Segoe UI, sans-serif; fill: #111827; }
      .body { font: 500 17px system-ui, -apple-system, Segoe UI, sans-serif; fill: #4b5563; }
      .small { font: 600 14px system-ui, -apple-system, Segoe UI, sans-serif; fill: #6b7280; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #374151; }
      .card-title { font: 800 17px system-ui, -apple-system, Segoe UI, sans-serif; fill: #111827; }
      .card-text { font: 500 14px system-ui, -apple-system, Segoe UI, sans-serif; fill: #4b5563; }
      .arrow { stroke: #7c3aed; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1040" height="420" rx="30" fill="url(#bg)"/>
  <rect x="24" y="24" width="992" height="372" rx="24" fill="#ffffff" fill-opacity="0.76" stroke="#ddd6fe"/>

  <text x="64" y="72" class="label">What to read first</text>
  <text x="64" y="112" class="title">Image pull errors are solved from the event text</text>
  <text x="64" y="146" class="body">The pod status names the symptom. The Kubernetes Event names the fix.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="190" width="230" height="92" rx="18" fill="#111827"/>
    <text x="92" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#d1d5db">pod status</text>
    <text x="92" y="256" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" font-weight="800" fill="#ffffff">ImagePullBackOff</text>
  </g>

  <path class="arrow" d="M310 236H344"/>
  <path class="arrow" d="M333 224l14 12-14 12"/>

  <g filter="url(#shadow)">
    <rect x="368" y="174" width="278" height="124" rx="20" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="396" y="212" class="mono">kubectl describe pod</text>
    <text x="396" y="246" class="card-title">Read Events</text>
    <text x="396" y="274" class="card-text">Find the first “Failed to pull image” message.</text>
  </g>

  <path class="arrow" d="M662 236H736"/>
  <path class="arrow" d="M725 224l14 12-14 12"/>

  <g filter="url(#shadow)">
    <rect x="736" y="190" width="240" height="92" rx="18" fill="url(#accent)"/>
    <text x="766" y="228" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Fix the named cause</text>
    <text x="766" y="258" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#ede9fe">Restart the owning rollout.</text>
  </g>

  <g>
    <rect x="64" y="326" width="132" height="44" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="130" y="354" text-anchor="middle" class="small">bad tag</text>

    <rect x="212" y="326" width="132" height="44" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="278" y="354" text-anchor="middle" class="small">pull secret</text>

    <rect x="360" y="326" width="132" height="44" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="426" y="354" text-anchor="middle" class="small">rate limit</text>

    <rect x="508" y="326" width="132" height="44" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="574" y="354" text-anchor="middle" class="small">DNS or egress</text>

    <rect x="656" y="326" width="132" height="44" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="722" y="354" text-anchor="middle" class="small">x509 or TLS</text>

    <rect x="804" y="326" width="172" height="44" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="890" y="354" text-anchor="middle" class="small">node disk pressure</text>
  </g>
</svg>
