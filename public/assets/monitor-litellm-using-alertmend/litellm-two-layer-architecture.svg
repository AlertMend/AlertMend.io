<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" fill="none" role="img" aria-label="LiteLLM two-layer monitoring: probe gateway and backend">
  <rect width="960" height="320" fill="#fafafa"/>
  <text x="480" y="28" text-anchor="middle" fill="#09090b" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Two layers to monitor: gateway AND backend</text>
  <!-- Client -->
  <rect x="24" y="72" width="88" height="44" rx="8" fill="#f4f4f5" stroke="#a1a1aa"/>
  <text x="68" y="100" text-anchor="middle" fill="#3f3f46" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Client SDK</text>
  <text x="120" y="100" fill="#a1a1aa" font-size="16">-&gt;</text>
  <!-- Public URL -->
  <rect x="136" y="64" width="120" height="60" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="196" y="88" text-anchor="middle" fill="#166534" font-family="system-ui,sans-serif" font-size="10" font-weight="700">Public URL</text>
  <text x="196" y="104" text-anchor="middle" fill="#166534" font-family="system-ui,sans-serif" font-size="9">external check</text>
  <text x="196" y="116" text-anchor="middle" fill="#16a34a" font-size="12">&#10003;</text>
  <text x="268" y="100" fill="#a1a1aa" font-size="16">-&gt;</text>
  <!-- Ingress -->
  <rect x="284" y="72" width="72" height="44" rx="8" fill="#f4f4f5" stroke="#a1a1aa"/>
  <text x="320" y="100" text-anchor="middle" fill="#3f3f46" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Ingress</text>
  <text x="368" y="100" fill="#a1a1aa" font-size="16">-&gt;</text>
  <!-- LiteLLM -->
  <rect x="384" y="48" width="200" height="92" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="484" y="72" text-anchor="middle" fill="#5b21b6" font-family="system-ui,sans-serif" font-size="12" font-weight="700">LiteLLM proxy</text>
  <text x="484" y="90" text-anchor="middle" fill="#166534" font-family="system-ui,sans-serif" font-size="9">/health/readiness &#10003;</text>
  <text x="484" y="104" text-anchor="middle" fill="#166534" font-family="system-ui,sans-serif" font-size="9">/v1/models &#10003;</text>
  <text x="484" y="118" text-anchor="middle" fill="#dc2626" font-family="system-ui,sans-serif" font-size="9">/health/liveliness only &#10007; most teams</text>
  <text x="596" y="100" fill="#a1a1aa" font-size="16">-&gt;</text>
  <!-- Backend -->
  <rect x="612" y="48" width="200" height="92" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="712" y="72" text-anchor="middle" fill="#166534" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Backend inference</text>
  <text x="712" y="92" text-anchor="middle" fill="#166534" font-family="system-ui,sans-serif" font-size="9">Ollama /api/tags &#10003;</text>
  <text x="712" y="106" text-anchor="middle" fill="#166534" font-family="system-ui,sans-serif" font-size="9">vLLM /v1/models &#10003;</text>
  <text x="712" y="124" text-anchor="middle" fill="#52525b" font-family="system-ui,sans-serif" font-size="9">separate layer check</text>
  <!-- Legend -->
  <rect x="832" y="72" width="104" height="44" rx="8" fill="#fff" stroke="#e4e4e7"/>
  <text x="884" y="92" text-anchor="middle" fill="#16a34a" font-family="system-ui,sans-serif" font-size="10">&#10003; probe here</text>
  <text x="884" y="108" text-anchor="middle" fill="#dc2626" font-family="system-ui,sans-serif" font-size="10">&#10007; not enough</text>
  <text x="480" y="200" text-anchor="middle" fill="#52525b" font-family="system-ui,sans-serif" font-size="11">Liveliness passing while requests fail = backend or readiness problem, not a dead proxy.</text>
  <text x="480" y="220" text-anchor="middle" fill="#71717a" font-family="system-ui,sans-serif" font-size="10">Monitor at least 4 checks across 2 layers: public URL, gateway readiness, models smoke, backend inference.</text>
</svg>
