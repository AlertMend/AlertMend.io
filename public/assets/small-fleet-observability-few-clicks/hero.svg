<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Small fleet observability with AlertMend">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f4f4f5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="72" y="72" width="1056" height="486" rx="10" fill="#fff" stroke="rgba(24,24,27,0.1)"/>
  <text x="600" y="150" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="36" font-weight="700" fill="#09090b">Small fleet observability</text>
  <text x="600" y="198" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#52525b">3 to 4 VMs · containers · logs + metrics + traces</text>

  <g font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600">
    <rect x="140" y="260" width="180" height="88" rx="8" fill="#fafafa" stroke="rgba(24,24,27,0.12)"/>
    <text x="230" y="300" text-anchor="middle" fill="#09090b">Metrics</text>
    <text x="230" y="326" text-anchor="middle" font-size="13" font-weight="500" fill="#71717a">Hosts + containers</text>

    <rect x="360" y="260" width="180" height="88" rx="8" fill="#fafafa" stroke="rgba(24,24,27,0.12)"/>
    <text x="450" y="300" text-anchor="middle" fill="#09090b">Logs</text>
    <text x="450" y="326" text-anchor="middle" font-size="13" font-weight="500" fill="#71717a">Journal + Docker</text>

    <rect x="580" y="260" width="180" height="88" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="670" y="300" text-anchor="middle" fill="#5b21b6">Traces</text>
    <text x="670" y="326" text-anchor="middle" font-size="13" font-weight="500" fill="#6d28d9">Request paths</text>

    <rect x="800" y="260" width="220" height="88" rx="8" fill="#09090b"/>
    <text x="910" y="300" text-anchor="middle" fill="#fafafa">Alerts + on-call</text>
    <text x="910" y="326" text-anchor="middle" font-size="13" font-weight="500" fill="rgba(250,250,250,0.7)">Escalate if unacked</text>
  </g>

  <text x="600" y="420" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#3f3f46">One place. A few clicks. AlertMend</text>
  <text x="600" y="470" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#71717a">Unified observability for small VM and container fleets</text>
</svg>
