<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none" role="img" aria-label="Sequence diagram: small fleet signals into AlertMend with Slack alert and on-call escalation">
  <rect width="960" height="640" fill="#fafafa"/>
  <text x="480" y="36" text-anchor="middle" fill="#09090b" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700">Small fleet to on-call in one flow</text>
  <text x="480" y="58" text-anchor="middle" fill="#52525b" font-family="system-ui,-apple-system,sans-serif" font-size="13">VMs and containers, AlertMend, Slack and escalation</text>

  <!-- Column headers -->
  <rect x="60" y="80" width="220" height="64" rx="6" fill="#fff" stroke="rgba(24,24,27,0.12)"/>
  <text x="170" y="118" text-anchor="middle" fill="#09090b" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700">Your fleet</text>

  <rect x="370" y="80" width="220" height="64" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="480" y="118" text-anchor="middle" fill="#5b21b6" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700">AlertMend</text>

  <rect x="680" y="80" width="220" height="64" rx="6" fill="#fff" stroke="rgba(24,24,27,0.12)"/>
  <text x="790" y="118" text-anchor="middle" fill="#09090b" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700">Team</text>

  <!-- Lifelines -->
  <line x1="170" y1="144" x2="170" y2="560" stroke="#e4e4e7" stroke-width="2"/>
  <line x1="480" y1="144" x2="480" y2="560" stroke="#c4b5fd" stroke-width="2"/>
  <line x1="790" y1="144" x2="790" y2="560" stroke="#e4e4e7" stroke-width="2"/>

  <!-- Step 1 -->
  <rect x="190" y="170" width="260" height="36" rx="18" fill="#fff" stroke="rgba(24,24,27,0.14)"/>
  <text x="320" y="193" text-anchor="middle" fill="#3f3f46" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600">Metrics, logs, traces</text>
  <polygon points="450,188 440,182 440,194" fill="#71717a"/>

  <!-- Step 2 -->
  <rect x="190" y="240" width="260" height="36" rx="18" fill="#fff" stroke="rgba(24,24,27,0.14)"/>
  <text x="320" y="263" text-anchor="middle" fill="#3f3f46" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600">Container exit detected</text>
  <polygon points="450,258 440,252 440,264" fill="#71717a"/>

  <!-- Step 3 -->
  <rect x="500" y="310" width="260" height="36" rx="18" fill="#fff" stroke="#7c3aed"/>
  <text x="630" y="333" text-anchor="middle" fill="#5b21b6" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600">Slack incident + context</text>
  <polygon points="760,328 750,322 750,334" fill="#7c3aed"/>

  <!-- Step 4 -->
  <rect x="500" y="380" width="260" height="36" rx="18" fill="#fff" stroke="rgba(24,24,27,0.14)"/>
  <text x="630" y="403" text-anchor="middle" fill="#3f3f46" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600">No ack from primary</text>
  <polygon points="760,398 750,392 750,404" fill="#71717a"/>

  <!-- Step 5 -->
  <rect x="500" y="450" width="260" height="36" rx="18" fill="#09090b"/>
  <text x="630" y="473" text-anchor="middle" fill="#fafafa" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600">Escalate to secondary</text>
  <polygon points="760,468 750,462 750,474" fill="#09090b"/>

  <!-- Outcome -->
  <rect x="200" y="530" width="560" height="56" rx="8" fill="#fff" stroke="rgba(24,24,27,0.1)"/>
  <text x="480" y="555" text-anchor="middle" fill="#09090b" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700">Outcome: right person paged with logs, metrics, and traces attached</text>
  <text x="480" y="576" text-anchor="middle" fill="#71717a" font-family="system-ui,-apple-system,sans-serif" font-size="12">No DIY stack. No missed escalation.</text>
</svg>
